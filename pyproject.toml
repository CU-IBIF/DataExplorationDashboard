[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "featurescope"
version = "0.1.0"
description = "Interactive exploration and pipeline building for high-dimensional object-by-feature data (cells, organelles, objects)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "anndata>=0.10",
  "scanpy>=1.10",
  "umap-learn>=0.5",
  "igraph>=0.11",
  "leidenalg>=0.10",
  "pyarrow>=14",
  "pyyaml>=6",
  "matplotlib>=3.7",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
deep = ["torch>=2.2"]
batch = ["harmonypy>=0.0.10"]
scvi = ["scvi-tools>=1.1"]
gpu = ["rapids-singlecell>=0.10"]   # install with the matching CUDA wheels / conda env
cloud = ["s3fs>=2024.2", "boto3>=1.34"]
dev = ["pytest>=8", "httpx>=0.27"]
all = ["featurescope[deep,batch,cloud]"]

[project.scripts]
featurescope = "featurescope.cli:main"

[tool.setuptools.packages.find]
include = ["featurescope*"]

[tool.setuptools.package-data]
featurescope = ["web/*", "web/vendor/*", "compute/templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
