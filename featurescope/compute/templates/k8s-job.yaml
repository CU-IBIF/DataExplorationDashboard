# Generated by FeatureScope. NRP Nautilus notes: requests must be close to limits,
# Jobs (not bare pods) are required for batch work, and data is staged via the
# namespace's S3 (Ceph) bucket. Credentials come from the secret below:
#   kubectl -n ${namespace} create secret generic ${secret} \
#     --from-literal=AWS_ACCESS_KEY_ID=... --from-literal=AWS_SECRET_ACCESS_KEY=...
apiVersion: batch/v1
kind: Job
metadata:
  name: ${name}
  namespace: ${namespace}
  labels: {app: featurescope}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      nodeSelector: ${node_selector}
      containers:
        - name: featurescope
          image: ${image}
          command: ["bash", "-c"]
          args: [${script}]
          envFrom:
            - secretRef: {name: ${secret}}
          resources:
            requests:
              cpu: "${cpu}"
              memory: "${memory}"
            limits:
              cpu: "${cpu}"
              memory: "${memory}"${gpu_limits}
          volumeMounts:
            - {name: work, mountPath: /work}
            - {name: dshm, mountPath: /dev/shm}
      volumes:
        - {name: work, emptyDir: {}}
        - {name: dshm, emptyDir: {medium: Memory}}
